name: morohunt
description: "MoroHunt (قناص المغرب) — Community hunting companion app for Morocco."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.6
  http: ^1.2.2

  # Maps (OpenStreetMap tiles — works on web, mobile, and desktop)
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.3.6
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1

  # Location & geolocation
  geolocator: ^12.0.0

  # Local persistence for offline zone caching
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  path: ^1.9.0

  # Image capture / upload
  image_picker: ^1.1.2

  # Geo utilities (point-in-polygon checks)
  turf: ^0.0.10

  # Local notifications for the forbidden-zone warning
  flutter_local_notifications: ^17.2.2

  # Google AdMob — interstitial ad shown when the Map screen opens
  google_mobile_ads: ^9.1.0

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/geo/JEU_RESERVE.geojson
    - assets/geo/AMODIATIONS_part1.geojson
    - assets/images/app_logo.png